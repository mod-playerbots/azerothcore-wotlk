###################################################################################################
#     AUTO GUILD REAL PLAYERS MODULE CONFIGURATION
###################################################################################################
#
#    AutoGuildRealPlayers.Enable
#        Description: Enable or disable the Auto Guild Real Players module
#        Default:     1 (enabled)
#                     0 (disabled)

AutoGuildRealPlayers.Enable = 1

#
#    AutoGuildRealPlayers.GuildName
#        Description: The name of the guild to create/use for real players
#                     If this guild doesn't exist, it will be created automatically
#                     Maximum 24 characters
#        Default:     "Real Players"

AutoGuildRealPlayers.GuildName = "Ascendancy"

#
#    AutoGuildRealPlayers.GuildMaster
#        Description: The character name that will be the guild master
#                     This character must exist and belong to a real player (not a bot)
#                     If the guild already exists, this setting is ignored
#        Default:     "" (must be configured)

AutoGuildRealPlayers.GuildMaster = "Thrawn"

#
#    AutoGuildRealPlayers.DefaultRank
#        Description: The default guild rank for new members
#                     Ranks: 0 = Guild Master, 1-4 = Officer/Member ranks (4 is typically lowest)
#        Default:     4 (Initiate)

AutoGuildRealPlayers.DefaultRank = 4

#
#    AutoGuildRealPlayers.AnnounceToPlayer
#        Description: Announce to the player when they are added to the guild
#        Default:     1 (enabled)
#                     0 (disabled)

AutoGuildRealPlayers.AnnounceToPlayer = 1

#
#    AutoGuildRealPlayers.GuildInfo
#        Description: Guild information text (max 500 characters)
#        Default:     "Guild for real players - bots excluded"

AutoGuildRealPlayers.GuildInfo = "Guild for real players - bots excluded"

#
#    AutoGuildRealPlayers.GuildMOTD
#        Description: Guild Message of the Day (max 128 characters)
#        Default:     "Welcome to the guild!"

AutoGuildRealPlayers.GuildMOTD = "Welcome to Ascendancy!"

#
#    AutoGuildRealPlayers.CreateMaxLevel
#        Description: Create the guild at max level with all perks unlocked
#        Default:     1 (enabled - guild level 25 with all perks)
#                     0 (disabled - starts at level 1)

AutoGuildRealPlayers.CreateMaxLevel = 1

###################################################################################################
